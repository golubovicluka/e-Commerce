<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol>
    @if (home) {
      <li>
        <a [routerLink]="home.routerLink" [attr.aria-label]="home.label ?? 'Home'">
          <span class="size-4" [class]="home.icon" aria-hidden="true"></span>
        </a>
      </li>
    }
    @for (item of items; track item.label) {
      <li class="breadcrumbs-separator rtl:rotate-180">
        <span class="icon-[tabler--chevron-right] size-4" aria-hidden="true"></span>
      </li>
      <li>
        <a [routerLink]="item.routerLink">{{ item.label }}</a>
      </li>
    }
  </ol>
</nav>
