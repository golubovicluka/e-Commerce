@if (product(); as item) {
  <a class="suggested-card" [routerLink]="['/product', item.id]"
    [attr.aria-label]="item.name + ' — view product'">
    <span class="badge-new">New</span>

    <span class="img-wrap">
      <img [src]="resolvedImage()" loading="lazy" decoding="async" (error)="onImageError($event)" [alt]="item.name">
    </span>

    <span class="product-name">{{ item.name }}</span>
    <span class="product-description">{{ item.description }}</span>

    <span class="card-foot">
      <span class="product-price font-mono">{{ item.price | number }} <span class="currency">RSD</span></span>
      @if (item.inStock > 0) {
        <span class="stock stock--in">
          <span class="stock-dot" aria-hidden="true"></span> In stock
        </span>
      } @else {
        <span class="stock stock--out">
          <span class="stock-dot" aria-hidden="true"></span> Sold out
        </span>
      }
    </span>
  </a>
}
