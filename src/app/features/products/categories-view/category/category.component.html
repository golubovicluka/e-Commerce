@if (category(); as item) {
  <a
    class="category-tile"
    routerLink="/products/search"
    [queryParams]="{ categoryId: item.id }"
    [attr.aria-label]="'Browse ' + item.name + ' products'"
    [ngStyle]="{ 'background-image': 'url(' + getCategoryImage(item.name) + ')' }"
  >
    <span class="category-overlay">
      <span class="category-name">{{ item.name }}</span>
      <span class="category-cta">
        Shop now <i class="pi pi-arrow-right" aria-hidden="true"></i>
      </span>
    </span>
  </a>
}
