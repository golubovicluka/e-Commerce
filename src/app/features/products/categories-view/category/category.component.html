<a class="category-tile" [routerLink]="['/products/search']" [state]="{ filters: name }"
  [ngStyle]="{'background-image': 'url(\'' + getCategoryImage(name) + '\')'}">
  <div class="category-overlay">
    <span class="category-name">{{name}}</span>
    <span class="category-cta">Shop now <span class="icon-[tabler--arrow-right]" aria-hidden="true"></span></span>
  </div>
</a>
