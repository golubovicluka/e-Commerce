<div class="checkout-panel component-enter">
  <div class="panel-head">
    <span class="eyebrow">Step 1 of 3</span>
    <h3 class="panel-title">Where should we deliver?</h3>
  </div>

  <div class="grid grid-cols-12 gap-4">
    <div class="field col-span-12 md:col-span-6">
      <label for="ship-name">First name</label>
      <input id="ship-name" class="input w-full" type="text" autocomplete="given-name" [(ngModel)]="name" />
    </div>
    <div class="field col-span-12 md:col-span-6">
      <label for="ship-lastname">Last name</label>
      <input id="ship-lastname" class="input w-full" type="text" autocomplete="family-name"
        [(ngModel)]="lastName" />
    </div>
    <div class="field col-span-12 md:col-span-8">
      <label for="ship-address">Street address</label>
      <input id="ship-address" class="input w-full" type="text" autocomplete="street-address"
        [(ngModel)]="address" />
    </div>
    <div class="field col-span-12 md:col-span-4">
      <label for="ship-apartment">Apartment <span class="optional">(optional)</span></label>
      <input id="ship-apartment" class="input w-full" type="text" [(ngModel)]="apartmentNumber" />
    </div>
    <div class="field col-span-12 md:col-span-4">
      <label for="ship-postal">Postal code</label>
      <input id="ship-postal" class="input w-full" type="text" autocomplete="postal-code" inputmode="numeric"
        [(ngModel)]="postalCode" />
    </div>
    <div class="field col-span-12 md:col-span-8">
      <label for="ship-city">City</label>
      <input id="ship-city" class="input w-full" type="text" autocomplete="address-level2" [(ngModel)]="city" />
    </div>
    <div class="field col-span-12 md:col-span-6">
      <label for="ship-phone">Phone number</label>
      <input id="ship-phone" class="input w-full" type="tel" autocomplete="tel" [(ngModel)]="phoneNumber" />
    </div>
    <div class="field col-span-12">
      <label for="ship-notes">Delivery notes <span class="optional">(optional)</span></label>
      <textarea id="ship-notes" class="textarea w-full" placeholder="Door code, floor, preferred time window…"
        rows="4" [(ngModel)]="additionalInformation"></textarea>
    </div>
  </div>

  <label class="save-details" for="saveDetails">
    <input class="checkbox checkbox-primary checkbox-sm" name="saveDetails" type="checkbox" [id]="saveFormDetails" [(ngModel)]="saveDetails">
    <span>Save these details for faster checkout next time</span>
  </label>

  <div class="panel-actions">
    <a class="btn btn-primary" [routerLink]="['/cart/overview']">
      Continue to overview <span class="icon-[tabler--arrow-right] size-4" aria-hidden="true"></span>
    </a>
  </div>
</div>
