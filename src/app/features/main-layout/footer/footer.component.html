<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <button type="button" class="footer-wordmark" (click)="toHome()">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span>Shoply</span>
      </button>
      <p class="footer-tagline">Reliable technology, transparent pricing and dependable service across Serbia.</p>
    </div>

    <div class="footer-column">
      <span class="footer-label">Catalog</span>
      <nav class="footer-links" aria-label="Footer navigation">
        <a [routerLink]="['/home']">Home</a>
        <a [routerLink]="['/products/search']">All products</a>
        <a [routerLink]="['/categories']">Departments</a>
      </nav>
    </div>

    <div class="footer-column service-column">
      <span class="footer-label">Service standard</span>
      <ul class="service-list">
        <li><span class="icon-[tabler--truck] service-icon" aria-hidden="true"></span> Free delivery</li>
        <li><span class="icon-[tabler--shield-check] service-icon" aria-hidden="true"></span> 2-year warranty</li>
        <li><span class="icon-[tabler--arrow-back-up] service-icon" aria-hidden="true"></span> 14-day returns</li>
      </ul>
    </div>

    <div class="footer-column">
      <span class="footer-label">Connect</span>
      <div class="footer-social">
        <a class="social-btn" aria-label="LinkedIn"
          href="https://rs.linkedin.com/in/lukagolubovic?trk=public_profile_browsemap"
          target="_blank" rel="noopener noreferrer">
          <span class="icon-[tabler--brand-linkedin] social-icon" aria-hidden="true"></span><span>LinkedIn</span>
        </a>
        <a class="social-btn" aria-label="GitHub"
          href="https://github.com/golubovicluka"
          target="_blank" rel="noopener noreferrer">
          <span class="icon-[tabler--brand-github] social-icon" aria-hidden="true"></span><span>GitHub</span>
        </a>
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    <span>&copy; 2026 Shoply. All rights reserved.</span>
    <span class="footer-location">Technology retail / Belgrade, Serbia</span>
  </div>
</footer>
